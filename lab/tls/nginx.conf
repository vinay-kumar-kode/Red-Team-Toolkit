# Lab TLS endpoint with two deliberate certificate problems:
#   tls.certificate-untrusted  - self-signed, so no chain of trust
#   tls.cert-long-validity     - 800 days, over the 398-day public CA limit
#
# Enable with:  docker compose --profile tls up -d
# Then:         python main.py tls --target 127.0.0.1 --port 8443 --i-understand
events {}
http {
    access_log off;
    server {
        listen 8443 ssl;
        server_name lab.invalid;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        # Deliberately still offering TLS 1.0 and 1.1 so the version checks fire.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers off;
        location / { return 200 "lab tls endpoint\n"; }
    }
}
