# Intentionally misconfigured server block for the lab.
#
# Each setting here is a mistake the toolkit is expected to catch, with the
# matching check noted so the lab doubles as documentation.

server {
    listen 80 default_server;
    server_name _;

    # web.no-https: the whole app is served over cleartext HTTP.
    root /usr/share/nginx/html;

    # web.header-disclosure + web.version-disclosure: hands over the exact build.
    server_tokens on;
    add_header X-Powered-By "PHP/7.2.24";
    add_header X-Generator "Drupal 7 (http://drupal.org)";

    # web.write-methods: advertising PUT and DELETE on a public web root.
    add_header Allow "GET, POST, PUT, DELETE";

    # web.cookie-attributes: a session cookie with none of the protective attributes.
    add_header Set-Cookie "PHPSESSID=rttlabsession; path=/";

    # web.csp-weak: a policy that allows any origin and inline script, which is
    # the same as having no policy at all.
    add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'";

    # web.trace-enabled: reflect the request back, which enables cross-site tracing.
    location / {
        index index.html index.php;
        try_files $uri $uri/ =404;
    }

    location = /server-status {
        stub_status on;
    }
}
