name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --upgrade pip && pip install -r requirements-dev.txt

      # Formatting first, so a pure-formatting diff fails fast and cheaply.
      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install --upgrade pip && pip install -r requirements-dev.txt

      # openssl backs the self-signed certificate fixtures. Install it rather
      # than letting those tests skip, so a broken TLS audit is a red build.
      - name: Ensure openssl is present
        run: |
          command -v openssl || (sudo apt-get update && sudo apt-get install -y openssl)

      - name: Run tests
        run: pytest --cov=redteam_toolkit --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --upgrade pip && pip install -r requirements.txt

      # The offline commands need no target and no authorization, so they are the
      # right smoke test: they exercise argument parsing, every renderer and the
      # exit-code contract without a single packet leaving the runner.
      - name: Offline commands
        run: |
          set -euo pipefail
          python main.py password --check 'Tr0ub4dor&3' --format none --fail-on critical
          python main.py password --check 'password' --format none || true
          python main.py hash-audit --file lab/hashes/dump.txt --format none
          python main.py logs --file lab/logs/auth.log --format all --output /tmp/rtt
          python main.py ssh --config lab/ssh/sshd_config --format none
          python main.py cve-lookup --product 'Apache HTTP Server' --version 2.4.49 --format none
          python main.py detect --rules --format none

      - name: Authorization gate refuses an unacknowledged scan
        run: |
          set -euo pipefail
          if python main.py scan --target 127.0.0.1 --ports 1 --quiet; then
            echo "expected the authorization gate to fail, but the scan ran" >&2
            exit 1
          fi
          echo "authorization gate correctly refused an unacknowledged scan"

      - name: Reports are valid and self-contained
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, pathlib, sys
          files = glob.glob('/tmp/rtt/*.json')
          assert files, 'no JSON report was written'
          for path in files:
              json.loads(pathlib.Path(path).read_text())
          html = glob.glob('/tmp/rtt/*.html')
          assert html, 'no HTML report was written'
          body = pathlib.Path(html[0]).read_text()
          assert body.startswith('<!doctype html>')
          assert '<script src' not in body, 'the HTML report must not fetch anything'
          print('reports are valid and self-contained')
          PY

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install dist/*.whl
          /tmp/install-check/bin/rtt --version
          /tmp/install-check/bin/rtt cve-lookup --list --format none

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
